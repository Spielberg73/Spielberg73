<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@TITLE@ - preview NeoPlat</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #0b0d12; color: #d8dee9;
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    padding: 20px 12px 32px;
  }
  h1 { font-size: 17px; margin: 0; letter-spacing: .08em; text-transform: uppercase; }
  .sub { margin: -8px 0 0; color: #7d8799; font-size: 12px; }
  .frame {
    border: 1px solid #232838; border-radius: 10px; padding: 10px;
    background: #11141d; box-shadow: 0 18px 50px rgba(0,0,0,.45);
  }
  canvas {
    display: block; image-rendering: pixelated; background: #000;
    border-radius: 4px; touch-action: none;
  }
  .bar { display: flex; flex-wrap: wrap; gap: 10px 18px; justify-content: center;
         color: #8b95a8; font-size: 12px; max-width: 760px; text-align: center; }
  #silencio { background: #1d2231; border: 1px solid #2b3245; border-radius: 4px;
              color: #cfd6e4; font: inherit; font-size: 12px; padding: 1px 8px;
              cursor: pointer; }
  kbd { background: #1d2231; border: 1px solid #2b3245; border-bottom-width: 2px;
        border-radius: 4px; padding: 1px 6px; font: 11px ui-monospace, monospace; color: #cfd6e4; }
  /* --- editor --- */
  .editor { display: none; flex-direction: column; gap: 10px; width: 100%; max-width: 760px; }
  .editor.visible { display: flex; }
  .barra { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .barra button, .barra select {
    background: #1d2231; border: 1px solid #2b3245; border-radius: 6px;
    color: #cfd6e4; font: inherit; font-size: 12px; padding: 4px 9px; cursor: pointer;
  }
  .barra button:hover { background: #272e42; }
  .barra .grupo { display: flex; gap: 4px; align-items: center; }
  .barra .etiqueta { color: #7d8799; font-size: 11px; text-transform: uppercase;
                     letter-spacing: .12em; }
  .paleta { display: flex; flex-wrap: wrap; gap: 6px; }
  .paleta button {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    background: #161a25; border: 1px solid #2b3245; border-radius: 6px;
    padding: 4px 5px; cursor: pointer; color: #8b95a8; font-size: 10px;
    min-width: 46px;
  }
  .paleta button.elegido { border-color: #f2b705; color: #f2d98a; background: #221d10; }
  .paleta canvas { image-rendering: pixelated; width: 32px; height: 32px; }
  .paleta .simbolo { font: 11px ui-monospace, monospace; color: #cfd6e4; }
  .aviso { color: #e8b04b; font-size: 12px; min-height: 16px; }
  .exportar { display: none; flex-direction: column; gap: 6px; }
  .exportar.visible { display: flex; }
  .exportar textarea {
    width: 100%; height: 190px; background: #0f131c; color: #cfd6e4;
    border: 1px solid #2b3245; border-radius: 6px; padding: 8px;
    font: 11px/1.45 ui-monospace, monospace; resize: vertical;
  }
  .pad { display: none; gap: 10px; margin-top: 6px; }
  .pad button {
    width: 62px; height: 56px; border-radius: 12px; border: 1px solid #2b3245;
    background: #1a1f2c; color: #cfd6e4; font-size: 18px; touch-action: none;
    user-select: none; -webkit-user-select: none;
  }
  .pad button:active { background: #2a3145; }
  @media (pointer: coarse) { .pad { display: flex; } }
</style>
</head>
<body>
<h1>@TITLE@</h1>
<p class="sub">preview NeoPlat &middot; 320&times;224 &middot; misma simulacion que la ROM &middot; @AUTHOR@</p>
<div class="frame"><canvas id="pantalla" width="320" height="224"></canvas></div>
<div class="bar">
  <span><kbd>&larr;</kbd><kbd>&rarr;</kbd> moverse</span>
  <span><kbd>Z</kbd> / <kbd>espacio</kbd> saltar</span>
  <span><kbd>&darr;</kbd> bajar de plataforma</span>
  <span><kbd>Enter</kbd> empezar</span>
  <span><kbd>R</kbd> reiniciar</span>
  <span><kbd>E</kbd> editar</span>
  <span><kbd>+</kbd> / <kbd>-</kbd> zoom</span>
  <span><kbd>M</kbd> <button id="silencio" type="button">sonido: si</button></span>
  <span><kbd>E</kbd> <button id="modo" type="button">editar el nivel</button></span>
</div>
<div class="editor" id="editor">
  <div class="barra">
    <span class="etiqueta">nivel</span>
    <select id="ed-nivel"></select>
    <div class="grupo">
      <span class="etiqueta">tamaño</span>
      <button type="button" data-tam="-1,0">&minus; ancho</button>
      <button type="button" data-tam="1,0">+ ancho</button>
      <button type="button" data-tam="0,-1">&minus; alto</button>
      <button type="button" data-tam="0,1">+ alto</button>
    </div>
    <button type="button" id="ed-deshacer">deshacer</button>
    <button type="button" id="ed-rejilla">rejilla</button>
    <button type="button" id="ed-exportar">game.yaml</button>
    <button type="button" id="ed-jugar">probar el nivel</button>
  </div>
  <div class="paleta" id="ed-paleta"></div>
  <div class="aviso" id="ed-aviso"></div>
  <div class="exportar" id="ed-panel">
    <div class="barra">
      <button type="button" id="ed-copiar">copiar al portapapeles</button>
      <button type="button" id="ed-descargar">descargar game.yaml</button>
      <span class="etiqueta" id="ed-copiado"></span>
    </div>
    <textarea id="ed-texto" spellcheck="false" readonly></textarea>
  </div>
</div>

<div class="pad">
  <button data-key="left">&larr;</button>
  <button data-key="right">&rarr;</button>
  <button data-key="down">&darr;</button>
  <button data-key="jump">A</button>
  <button data-key="start">ST</button>
</div>

<script>
@CORE@
</script>
<script>
@EDITOR@
</script>
<script>
(function () {
  "use strict";
  var DATA = @DATA@;
  var canvas = document.getElementById("pantalla");
  var ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;

  var world = NPCore.create(DATA);
  var images = {};
  var input = 0;
  /* Pulsaciones muy cortas (menos de un frame) se perderian, porque el juego
     lee el mando 60 veces por segundo. Las guardamos hasta el siguiente paso. */
  var latched = 0;
  var scale = 3;

  var KEYS = {
    ArrowLeft: NPCore.IN.LEFT, KeyA: NPCore.IN.LEFT,
    ArrowRight: NPCore.IN.RIGHT, KeyD: NPCore.IN.RIGHT,
    ArrowUp: NPCore.IN.UP, KeyW: NPCore.IN.UP,
    ArrowDown: NPCore.IN.DOWN, KeyS: NPCore.IN.DOWN,
    KeyZ: NPCore.IN.JUMP, Space: NPCore.IN.JUMP, KeyK: NPCore.IN.JUMP,
    KeyX: NPCore.IN.ACTION, KeyL: NPCore.IN.ACTION,
    Enter: NPCore.IN.START
  };
  var PAD = {
    left: NPCore.IN.LEFT, right: NPCore.IN.RIGHT, down: NPCore.IN.DOWN,
    jump: NPCore.IN.JUMP, start: NPCore.IN.START
  };

  document.addEventListener("keydown", function (ev) {
    audio.iniciar();
    if (ev.code === "KeyM") { silenciar(); return; }
    if (ev.code === "KeyE") {
      if (editor.activo) modoJuego(); else modoEditor();
      return;
    }
    if (editor.activo) {
      if (ev.code === "KeyZ" && (ev.ctrlKey || ev.metaKey)) { editor.deshacer(); return; }
      var paso = ev.shiftKey ? 64 : 16;
      if (ev.code === "ArrowLeft") { editor.mover(-paso, 0); ev.preventDefault(); return; }
      if (ev.code === "ArrowRight") { editor.mover(paso, 0); ev.preventDefault(); return; }
      if (ev.code === "ArrowUp") { editor.mover(0, -paso); ev.preventDefault(); return; }
      if (ev.code === "ArrowDown") { editor.mover(0, paso); ev.preventDefault(); return; }
      if (ev.code === "Enter") { editor.aplicar(); ev.preventDefault(); return; }
      return;
    }
    if (ev.code === "KeyR") { world = NPCore.create(DATA); return; }
    if (ev.code === "Equal" || ev.code === "NumpadAdd") { setScale(scale + 1); return; }
    if (ev.code === "Minus" || ev.code === "NumpadSubtract") { setScale(scale - 1); return; }
    var bit = KEYS[ev.code];
    if (bit) { input |= bit; latched |= bit; ev.preventDefault(); }
  });
  document.addEventListener("keyup", function (ev) {
    var bit = KEYS[ev.code];
    if (bit) { input &= ~bit; ev.preventDefault(); }
  });
  Array.prototype.forEach.call(document.querySelectorAll(".pad button"), function (btn) {
    var bit = PAD[btn.dataset.key];
    var press = function (ev) { ev.preventDefault(); input |= bit; latched |= bit; };
    var release = function (ev) { ev.preventDefault(); input &= ~bit; };
    btn.addEventListener("touchstart", press, { passive: false });
    btn.addEventListener("touchend", release, { passive: false });
    btn.addEventListener("mousedown", press);
    btn.addEventListener("mouseup", release);
    btn.addEventListener("mouseleave", release);
  });

  /* ---------------------------------------------------------------- audio
   * La Neo Geo hace el sonido con el YM2610; NeoPlat usa sus tres canales de
   * onda cuadrada (SSG): dos para la musica y uno para los efectos. Aqui se
   * imita con osciladores del navegador, avanzando la secuencia un paso por
   * frame, igual que hace el driver de la consola.
   */
  var audio = {
    ctx: null,
    silencio: false,
    canales: [],          // 0 y 1 = musica, 2 = efectos
    tema: -1,
    pistas: [],           // {pasos, i, resto}
    efecto: null,         // {pasos, i, resto}
    reloj: (DATA.sonido && DATA.sonido.reloj) || 4000000,

    hz: function (periodo) { return periodo > 0 ? this.reloj / (16 * periodo) : 0; },

    iniciar: function () {
      if (this.ctx || this.silencio) return;
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      this.ctx = new Ctx();
      for (var i = 0; i < 3; i++) {
        var osc = this.ctx.createOscillator();
        var gain = this.ctx.createGain();
        osc.type = "square";
        osc.frequency.value = 440;
        gain.gain.value = 0;
        osc.connect(gain).connect(this.ctx.destination);
        osc.start();
        this.canales.push({ osc: osc, gain: gain });
      }
      // ruido para los golpes: un buffer corto que se repite
      var largo = Math.floor(this.ctx.sampleRate * 0.5);
      var buffer = this.ctx.createBuffer(1, largo, this.ctx.sampleRate);
      var datos = buffer.getChannelData(0);
      for (var n = 0; n < largo; n++) datos[n] = Math.random() * 2 - 1;
      this.ruidoBuffer = buffer;
    },

    voz: function (canal, periodo, volumen) {
      if (!this.ctx) return;
      var c = this.canales[canal];
      var ahora = this.ctx.currentTime;
      if (!periodo || volumen <= 0) {
        c.gain.gain.setTargetAtTime(0, ahora, 0.005);
        return;
      }
      c.osc.frequency.setValueAtTime(this.hz(periodo), ahora);
      // el SSG tiene 16 pasos de volumen y suena logaritmico
      var nivel = Math.pow(volumen / 15, 2) * 0.12;
      c.gain.gain.setTargetAtTime(nivel, ahora, 0.005);
    },

    golpe: function (volumen, duracion) {
      if (!this.ctx || !this.ruidoBuffer) return;
      var fuente = this.ctx.createBufferSource();
      var gain = this.ctx.createGain();
      fuente.buffer = this.ruidoBuffer;
      var ahora = this.ctx.currentTime;
      var segundos = Math.max(0.03, duracion / 60);
      gain.gain.setValueAtTime(Math.pow(volumen / 15, 2) * 0.16, ahora);
      gain.gain.exponentialRampToValueAtTime(0.0001, ahora + segundos);
      fuente.connect(gain).connect(this.ctx.destination);
      fuente.start();
      fuente.stop(ahora + segundos);
    },

    tocarMusica: function (indice) {
      if (!DATA.sonido || !DATA.sonido.musica.length) return;
      if (indice === this.tema) return;
      this.tema = indice;
      this.pistas = [];
      this.voz(0, 0, 0);
      this.voz(1, 0, 0);
      if (indice < 0) return;
      var tema = DATA.sonido.musica[indice];
      if (!tema) return;
      for (var i = 0; i < tema.pistas.length && i < 2; i++)
        this.pistas.push({ pasos: tema.pistas[i], i: 0, resto: 0, bucle: tema.bucle });
    },

    evento: function (bits) {
      if (!DATA.sonido || !bits) return;
      this.iniciar();
      var eventos = DATA.sonido.eventos;
      for (var clave in eventos) {
        var bit = parseInt(clave, 10);
        if (!(bits & bit)) continue;
        var pasos = DATA.sonido.efectos[eventos[clave]];
        if (pasos && pasos.length) this.efecto = { pasos: pasos, i: 0, resto: 0 };
      }
    },

    /* Un paso por frame, igual que el driver de la consola. */
    tick: function () {
      if (!this.ctx || this.silencio) return;
      var p, paso;
      for (var t = 0; t < this.pistas.length; t++) {
        p = this.pistas[t];
        if (p.resto <= 0) {
          if (p.i >= p.pasos.length) {
            if (!p.bucle) { this.voz(t, 0, 0); continue; }
            p.i = 0;
          }
          paso = p.pasos[p.i++];
          p.resto = paso[1];
          this.voz(t, paso[0], paso[2]);
        }
        p.resto--;
      }
      if (this.efecto) {
        p = this.efecto;
        if (p.resto <= 0) {
          if (p.i >= p.pasos.length) {
            this.efecto = null;
            this.voz(2, 0, 0);
          } else {
            paso = p.pasos[p.i++];
            p.resto = paso[1];
            if (paso[3]) { this.golpe(paso[2], paso[1]); this.voz(2, 0, 0); }
            else this.voz(2, paso[0], paso[2]);
          }
        }
        if (this.efecto) this.efecto.resto--;
      }
    },

    alternarSilencio: function () {
      this.silencio = !this.silencio;
      if (this.silencio) { this.voz(0, 0, 0); this.voz(1, 0, 0); this.voz(2, 0, 0); }
      return this.silencio;
    }
  };

  function setScale(value) {
    scale = Math.max(1, Math.min(6, value));
    canvas.style.width = (NPCore.SCREEN_W * scale) + "px";
    canvas.style.height = (NPCore.SCREEN_H * scale) + "px";
  }
  setScale(Math.max(1, Math.min(4, Math.floor((window.innerWidth - 60) / NPCore.SCREEN_W))));

  function silenciar() {
    var boton = document.getElementById("silencio");
    var callado = audio.alternarSilencio();
    if (boton) boton.textContent = callado ? "sonido: no" : "sonido: si";
  }
  var botonSilencio = document.getElementById("silencio");
  if (botonSilencio) botonSilencio.addEventListener("click", function () {
    audio.iniciar();
    silenciar();
  });
  document.querySelector("canvas").addEventListener("pointerdown", function () {
    audio.iniciar();
  });

  function loadImages(done) {
    var names = Object.keys(DATA.sheets), pending = names.length;
    if (!pending) return done();
    names.forEach(function (name) {
      var img = new Image();
      img.onload = img.onerror = function () { if (--pending === 0) done(); };
      img.src = DATA.sheets[name].url;
      images[name] = img;
    });
  }

  function drawFrame(sheetName, frame, x, y, flip) {
    var sheet = DATA.sheets[sheetName];
    var img = images[sheetName];
    if (!img) return;
    var col = frame % sheet.per_row;
    var row = (frame / sheet.per_row) | 0;
    var sx = col * sheet.frame_w, sy = row * sheet.frame_h;
    if (flip) {
      ctx.save();
      ctx.translate(x + sheet.frame_w, y);
      ctx.scale(-1, 1);
      ctx.drawImage(img, sx, sy, sheet.frame_w, sheet.frame_h, 0, 0, sheet.frame_w, sheet.frame_h);
      ctx.restore();
    } else {
      ctx.drawImage(img, sx, sy, sheet.frame_w, sheet.frame_h, x, y, sheet.frame_w, sheet.frame_h);
    }
  }

  /* Capas de parallax: mismo calculo que np_video.c en la consola. */
  function drawLayers() {
    var capas = world.level.layers || [];
    for (var n = 0; n < capas.length; n++) {
      var L = DATA.layers[capas[n]];
      var scrollX = (world.camX * L.speed_x) >> 8;
      var scrollY = (world.camY * L.speed_y) >> 8;
      var col0 = scrollX >> 4, offX = scrollX & 15;
      var y = L.offset_y - scrollY;
      for (var i = 0; i <= 20; i++) {
        var col = col0 + i;
        if (L.repeat) col = ((col % L.cols) + L.cols) % L.cols;
        else if (col < 0 || col >= L.cols) continue;
        for (var r = 0; r < L.rows; r++)
          drawFrame(L.sheet, r * L.cols + col, i * 16 - offX, y + r * 16, false);
      }
    }
  }

  function drawBackground() {
    var level = world.level;
    var camX = world.camX, camY = world.camY;
    var col0 = camX >> 4, row0 = camY >> 4;
    var offX = camX & 15, offY = camY & 15;
    for (var c = 0; c <= 20; c++) {
      for (var r = 0; r <= 14; r++) {
        var tx = col0 + c, ty = row0 + r;
        if (tx < 0 || tx >= level.width || ty < 0 || ty >= level.height) continue;
        var tile = DATA.tiles.gfx[level.cells[ty * level.width + tx]];
        drawFrame("__tiles__", tile, c * 16 - offX, r * 16 - offY, false);
      }
    }
  }

  function drawActor(def, x, y, frame, flip) {
    drawFrame(def.sheet, frame, x, y, flip);
  }

  function drawEntities() {
    for (var i = 0; i < world.entityCount; i++) {
      var e = world.entities[i];
      if (!e.active) continue;
      if (e.hurt && (world.frame & 1)) continue;
      var def = world.entityDef(e).actor;
      var sx = NPCore.F2I(e.x) - def.box_x - world.camX;
      var sy = NPCore.F2I(e.y) - def.box_y - world.camY;
      if (sx <= -def.frame_w || sx >= NPCore.SCREEN_W) continue;
      if (sy <= -def.frame_h || sy >= NPCore.SCREEN_H) continue;
      drawActor(def, sx, sy, NPCore.actorFrame(def, e.anim, e.animFrame), !e.facing);
    }
  }

  function drawPlayer() {
    if (!world.playerVisible()) return;
    var def = DATA.player.actor;
    var p = world.player;
    drawActor(def, NPCore.F2I(p.x) - def.box_x - world.camX,
              NPCore.F2I(p.y) - def.box_y - world.camY,
              NPCore.actorFrame(def, p.anim, p.animFrame), !p.facing);
  }

  /* Mismo texto y misma fuente 3x5 que el plano fix de la consola. */
  function text(col, row, str, color) {
    ctx.fillStyle = color || "#ffffff";
    for (var i = 0; i < str.length; i++) {
      var glyph = DATA.font[str[i].toUpperCase()] || DATA.font[str[i]];
      if (!glyph) continue;
      var x = (col + i) * 8 + 2, y = row * 8 + 1;
      for (var gy = 0; gy < 5; gy++)
        for (var gx = 0; gx < 3; gx++)
          if ((glyph[gy] >> (2 - gx)) & 1) ctx.fillRect(x + gx, y + gy, 1, 1);
    }
  }

  function pad(value, digits) {
    var s = String(value);
    while (s.length < digits) s = "0" + s;
    return s;
  }

  function drawHud() {
    if (!DATA.hud) return;
    text(2, 1, "SCORE");
    text(8, 1, pad(world.score, 6));
    text(30, 1, "LIVES");
    text(36, 1, String(world.lives));
    if (DATA.time_limit) {
      text(18, 1, "TIME");
      text(23, 1, pad((world.timeLeft / 60) | 0, 3));
    }
    if (world.state === NPCore.STATE.TITLE) {
      text(12, 12, DATA.title);
      text(12, 14, "PRESS START");
      if (DATA.author) text(12, 16, DATA.author);
    } else if (world.state === NPCore.STATE.GAME_OVER) {
      text(15, 13, "GAME OVER");
    } else if (world.state === NPCore.STATE.FINISHED) {
      text(15, 13, "YOU WIN!");
    } else if (world.state === NPCore.STATE.LEVEL_END) {
      text(14, 13, "LEVEL CLEAR");
    }
  }

  function render() {
    ctx.fillStyle = world.level.background || "#000000";
    ctx.fillRect(0, 0, NPCore.SCREEN_W, NPCore.SCREEN_H);
    drawLayers();
    drawBackground();
    drawEntities();
    drawPlayer();
    drawHud();
  }

  var last = 0, acc = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    if (editor.activo) {                 /* en modo edicion el juego se pausa */
      editor.dibujar();
      last = now;
      acc = 0;
      return;
    }
    if (!last) last = now;
    acc += now - last;
    last = now;
    if (acc > 250) acc = 250;          /* pestana en segundo plano: no acumular */
    var steps = 0;
    while (acc >= 1000 / 60 && steps < 4) {
      world.step(input | latched);
      latched = 0;
      if (world.sfx) audio.evento(world.sfx);
      audio.tocarMusica(world.state === NPCore.STATE.PLAY ?
                        (world.level.music || 0) - 1 : -1);
      audio.tick();
      acc -= 1000 / 60;
      steps++;
    }
    render();
  }

  /* ------------------------------------------------------------- editor */
  var editor = NPEditor.crear({
    data: DATA,
    canvas: canvas,
    ctx: ctx,
    dibujarFrame: drawFrame,
    alJugar: function () {
      world = NPCore.create(DATA);
      world.step(NPCore.IN.START);
      if (editor.nivel > 0) world.loadLevel(editor.nivel);
      modoJuego();
    },
    alCambiar: function () { refrescarEditor(); }
  });

  var elEditor = document.getElementById("editor");
  var elNivel = document.getElementById("ed-nivel");
  var elPaleta = document.getElementById("ed-paleta");
  var elAviso = document.getElementById("ed-aviso");
  var elPanel = document.getElementById("ed-panel");
  var elTexto = document.getElementById("ed-texto");
  var elModo = document.getElementById("modo");

  DATA.levels.forEach(function (nivel, i) {
    var opcion = document.createElement("option");
    opcion.value = String(i);
    opcion.textContent = (i + 1) + ". " + nivel.name;
    elNivel.appendChild(opcion);
  });

  function construirPaleta() {
    elPaleta.innerHTML = "";
    editor.paleta().forEach(function (entrada) {
      var boton = document.createElement("button");
      boton.type = "button";
      boton.title = entrada.etiqueta + "  (" + entrada.char + ")";
      if (entrada.hoja) {
        var mini = document.createElement("canvas");
        mini.width = 16;
        mini.height = 16;
        var mctx = mini.getContext("2d");
        mctx.imageSmoothingEnabled = false;
        var hoja = DATA.sheets[entrada.hoja], imagen = images[entrada.hoja];
        if (imagen) {
          var col = entrada.frame % hoja.per_row;
          var fila = (entrada.frame / hoja.per_row) | 0;
          mctx.drawImage(imagen, col * hoja.frame_w, fila * hoja.frame_h,
                         hoja.frame_w, hoja.frame_h, 0, 0, 16,
                         16 * hoja.frame_h / hoja.frame_w);
        }
        boton.appendChild(mini);
      } else {
        var icono = document.createElement("div");
        icono.textContent = "✋";
        icono.style.fontSize = "22px";
        icono.style.lineHeight = "32px";
        boton.appendChild(icono);
      }
      var simbolo = document.createElement("span");
      simbolo.className = "simbolo";
      simbolo.textContent = entrada.char === "mano" ? "mover" : entrada.char;
      boton.appendChild(simbolo);
      var etiqueta = document.createElement("span");
      etiqueta.textContent = entrada.etiqueta;
      boton.appendChild(etiqueta);
      if (entrada.char === editor.herramienta) boton.className = "elegido";
      boton.addEventListener("click", function () {
        editor.herramienta = entrada.char;
        construirPaleta();
      });
      elPaleta.appendChild(boton);
    });
  }

  function refrescarEditor() {
    elAviso.textContent = editor.aviso;
    if (elPanel.classList.contains("visible")) elTexto.value = editor.exportarYaml();
  }

  function modoEditor() {
    editor.entrar();
    elEditor.classList.add("visible");
    elModo.textContent = "volver a jugar";
    elNivel.value = String(editor.nivel);
    construirPaleta();
    refrescarEditor();
  }

  function modoJuego() {
    editor.salir();
    elEditor.classList.remove("visible");
    elPanel.classList.remove("visible");
    elModo.textContent = "editar el nivel";
  }

  elModo.addEventListener("click", function () {
    if (editor.activo) modoJuego();
    else modoEditor();
  });
  elNivel.addEventListener("change", function () {
    editor.cambiarNivel(parseInt(elNivel.value, 10));
    construirPaleta();
  });
  document.getElementById("ed-deshacer").addEventListener("click", function () {
    editor.deshacer();
    elNivel.value = String(editor.nivel);
  });
  document.getElementById("ed-rejilla").addEventListener("click", function () {
    editor.rejilla = !editor.rejilla;
  });
  document.getElementById("ed-jugar").addEventListener("click", function () {
    editor.aplicar();
  });
  document.getElementById("ed-exportar").addEventListener("click", function () {
    elPanel.classList.toggle("visible");
    if (elPanel.classList.contains("visible")) elTexto.value = editor.exportarYaml();
  });
  document.getElementById("ed-copiar").addEventListener("click", function () {
    var aviso = document.getElementById("ed-copiado");
    elTexto.select();
    var hecho = false;
    try { hecho = document.execCommand("copy"); } catch (e) { hecho = false; }
    if (!hecho && navigator.clipboard) {
      navigator.clipboard.writeText(elTexto.value).then(function () {
        aviso.textContent = "copiado";
      });
      return;
    }
    aviso.textContent = hecho ? "copiado" : "selecciona y copia a mano";
  });
  document.getElementById("ed-descargar").addEventListener("click", function () {
    var texto = editor.exportarYaml();
    var aviso = document.getElementById("ed-copiado");
    /* Si la pagina esta publicada en claude.ai, las descargas pasan por el
       visor y solo admiten ciertas extensiones; en local basta con un enlace. */
    if (window.claude && typeof window.claude.use === "function") {
      window.claude.use("downloads").then(function (descargas) {
        if (!descargas) { aviso.textContent = "aqui no se puede descargar: usa copiar"; return; }
        descargas.save({ filename: "game.yaml.txt", data: texto }).then(function () {
          aviso.textContent = "guardado (renombralo a game.yaml)";
        }, function (error) {
          aviso.textContent = (error && error.code === "declined")
            ? "descarga cancelada" : "no se pudo descargar: usa copiar";
        });
      });
      return;
    }
    var blob = new Blob([texto], { type: "text/yaml" });
    var enlace = document.createElement("a");
    enlace.href = URL.createObjectURL(blob);
    enlace.download = "game.yaml";
    enlace.click();
    setTimeout(function () { URL.revokeObjectURL(enlace.href); }, 2000);
    aviso.textContent = "descargado";
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-tam]"), function (boton) {
    boton.addEventListener("click", function () {
      var partes = boton.dataset.tam.split(",");
      editor.redimensionar(parseInt(partes[0], 10), parseInt(partes[1], 10));
    });
  });

  function posicionEnCanvas(ev) {
    var caja = canvas.getBoundingClientRect();
    return {
      x: (ev.clientX - caja.left) * canvas.width / caja.width,
      y: (ev.clientY - caja.top) * canvas.height / caja.height
    };
  }

  canvas.addEventListener("pointerdown", function (ev) {
    if (!editor.activo) { audio.iniciar(); return; }
    var p = posicionEnCanvas(ev);
    editor.pulsar(p.x, p.y, ev.button);
    canvas.setPointerCapture(ev.pointerId);
    ev.preventDefault();
  });
  canvas.addEventListener("pointermove", function (ev) {
    if (!editor.activo) return;
    var p = posicionEnCanvas(ev);
    editor.mover_raton(p.x, p.y);
  });
  canvas.addEventListener("pointerup", function () { editor.soltar(); });
  canvas.addEventListener("pointercancel", function () { editor.soltar(); });
  canvas.addEventListener("contextmenu", function (ev) {
    if (editor.activo) ev.preventDefault();
  });

  /* Enganche para herramientas y pruebas automaticas (capturas, bots...). */
  window.NeoPlat = {
    data: DATA,
    get world() { return world; },
    get input() { return input; },
    audio: audio,
    editor: editor,
    modoEditor: modoEditor,
    modoJuego: modoJuego,
    reiniciar: function () { world = NPCore.create(DATA); },
    pulsar: function (bits) { latched |= bits; },
    soltar: function (bits) { input &= ~bits; }
  };

  loadImages(function () {
    construirPaleta();
    requestAnimationFrame(loop);
  });
})();
</script>
</body>
</html>
