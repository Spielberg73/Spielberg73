# COSTA Y MONTANA: el ejemplo de conducir del kit.
#
# Sale de `ngplat nuevo --genero carretera`, con los dibujos que no usa
# quitados de en medio: aqui la calzada **no es un dibujo**, son siete colores
# que el motor pinta linea a linea (ver `carretera:` mas abajo), asi que lo
# unico que se dibuja son el coche, el trafico y las casillas del trazado.
#
# El genero entero esta contado en docs/tutorial.md y todas las claves en
# docs/formato.md.
#
#   ngplat probar     -> abre el preview jugable en el navegador
#   ngplat compilar   -> genera el proyecto en C y las ROMs graficas
#
# Los mandos, que caben en cualquier mando de dos botones:
#
#   accion (X) ........ el acelerador. Hay que **mantenerlo**.
#   abajo .............. el freno
#   saltar (Z) ......... la marcha: corta para salir, larga para correr
#   izquierda/derecha .. el volante
#
# Y la regla del genero, que no esta programada en ningun sitio: el coche va
# **recto**. Si la carretera tuerce y tu no giras, te sales, y fuera del asfalto
# no se corre.
#
# Cuanto puede torcer una curva sale de una division: el coche sube `velocidad`
# por frame y se mueve de lado `volante * velocidad / punta`, asi que lo que se
# desplaza **por cada fila** es volante/punta y no depende de a cuanto vayas.
# Con estos numeros son 5,87 pixeles por fila: la curva mas cerrada que se
# sigue desplaza una casilla cada tres filas. Frenar no traza mas fino -la
# linea es la misma a cualquier velocidad-; lo que se gana frenando es que el
# trompo solo salta si ibas mas rapido que `lento:`, asi que arrimarse despacio
# al quitamiedos no te hace dar vueltas.

juego:
  titulo: "COSTA Y MONTANA"
  autor: "NEOPLAT"
  vidas: 3
  tiempo: 60           # segundos. Los controles de paso lo alargan.
  vista: carretera
  camara: scroll
  fondo: "#4878c8"     # el cielo

# El motor, el freno y el volante. Son las unicas cifras del genero.
coche:
  punta: 6.0           # lo que corre con la marcha larga
  punta_corta: 3.2     # y con la corta
  acelera: 0.030       # lo que gana por frame con la larga
  acelera_corta: 0.075 # y con la corta, que empuja mas
  frena: 0.140
  roce: 0.020          # lo que pierde solo, sin tocar nada
  volante: 2.2         # lo que se mueve de lado, a punta
  lento: 1.6           # lo que corre como mucho fuera del asfalto
  arrastre: 0.180      # y lo que le roba por frame la hierba
  trompo: 90           # frames dando vueltas despues de un choque
  control: 20          # segundos que regala cruzar un control de paso

# Los siete colores con los que se pinta la calzada. Van en pares porque la
# carretera se pinta a franjas que corren hacia ti: eso es lo que hace que se
# note la velocidad, y es como se hacia en los recreativos.
# Los dos tonos de cada pareja tienen que separarse bastante: la Mega Drive y
# el Atari ST guardan tres bits por canal, y dos tonos parecidos les caen en
# el mismo color -y entonces la carretera se ve lisa-.
carretera:
  asfalto: ["#4a4a52", "#282830"]
  arcen:   ["#d0d0d8", "#c02020"]
  hierba:  ["#3a7a42", "#2c5434"]
  raya:    "#e8e8f0"
  ancho_arcen: 8

jugador:
  sprite: graficos/coche.png
  frame: [64, 32]
  caja: [40, 14]       # la caja es el coche, no el aire de encima
  vida: 1
  animaciones:
    # Los tres primeros son ir recto con **la melena de ella** en sus tres
    # posiciones, y los tres siguientes lo mismo girando. La melena no corre
    # a un ritmo fijo: se pasa mas deprisa cuanto mas corre el coche, asi que
    # parado no se mueve y a tope va suelta.
    quieto: {frames: [0, 1, 2], velocidad: 6}
    correr: {frames: [0, 1, 2], velocidad: 6}   # girando, la melena sigue
    dano:   {frames: [3]}      # el trompo

enemigos:
  # El trafico: coches que van a lo suyo, por su carril y a su velocidad. No
  # te persiguen -no son enemigos, son estorbos-: lo que decides es por que
  # lado pasarlos.
  rival:
    sprite: graficos/rival.png
    frame: [64, 32]
    caja: [40, 14]
    comportamiento: trafico
    velocidad: 2.6
    vida: 99
    puntos: 0

# Sin objetos que recoger: aqui lo unico que se gana es tiempo, y se gana
# llegando. Se deja el hueco -en la misma linea, que es como lo lee tambien el
# analizador de repuesto- para que anadir uno sea escribirlo debajo.
objetos: {}

tiles:
  imagen: graficos/tiles.png
  leyenda:
    '.': {tile: 0, tipo: vacio}      # el asfalto
    ',': {tile: 1, tipo: hierba}     # fuera: no para, pero ahi no se corre
    '#': {tile: 2, tipo: solido}     # el quitamiedos: chocar es un trompo
    'K': {tile: 3, tipo: control}    # control de paso: regala segundos
    'G': {tile: 3, tipo: meta}       # y la meta

spawns:
  r: rival

sonido:
  musica:
    # Dos canciones de conducir. La regla es una: **bajo a corcheas y sin
    # parar**, porque lo que hay debajo de un juego de carretera es un motor
    # que no se calla. Encima, una melodia que sube, que es lo que suena a
    # carretera abierta.
    costa:
      velocidad: 8
      timbres: [metal, bajo]  # con que suena cada pista (solo FM)
      pistas:
        - |
          mi5 - sol5 la5 - si5 do6 -
          si5 - la5 sol5 - mi5 sol5 -
          la5 - do6 re6 - do6 si5 -
          la5 - sol5 mi5 - re5 mi5 -
        - |
          la2 la2 mi3 mi3 la2 la2 mi3 mi3
          fa2 fa2 do3 do3 fa2 fa2 do3 do3
          sol2 sol2 re3 re3 sol2 sol2 re3 re3
          la2 la2 mi3 mi3 la2 la2 mi3 mi3
    montana:
      velocidad: 7
      timbres: [metal, bajo]  # con que suena cada pista (solo FM)
      pistas:
        - |
          re5 - fa5 la5 - sol5 fa5 -
          mi5 - sol5 do6 - si5 la5 -
          fa5 - la5 do6 - re6 do6 -
          la5 - sol5 fa5 - mi5 re5 -
        - |
          re2 re2 la2 la2 re2 re2 la2 la2
          si1 si1 fa2 fa2 si1 si1 fa2 fa2
          sol2 sol2 re3 re3 sol2 sol2 re3 re3
          la2 la2 mi3 mi3 la2 la2 mi3 mi3


